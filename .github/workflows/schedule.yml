name: Trigger Cloudflare Worker 6

'on':
  schedule:
    # GitHub cron is UTC and may be delayed slightly; the Worker applies the Cairo schedule.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-cloudflare-worker-6
  cancel-in-progress: false

jobs:
  ping_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Worker scheduler and wait for result
        env:
          WORKER_URL: "https://6newgirl.newgirl-j.workers.dev"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          auth_args=()
          if [ -n "${CRON_SECRET:-}" ]; then
            auth_args=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          response=$(curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 480 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            "${auth_args[@]}" \
            --write-out "\nHTTP_STATUS:%{http_code}\n" \
            "${WORKER_URL}/api/cron-trigger" 2>&1)
          curl_exit=$?

          printf '%s\n' "$response"
          echo "CURL_EXIT_CODE=$curl_exit"
          exit "$curl_exit"
