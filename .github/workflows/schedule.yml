name: Trigger Cloudflare Worker 6

on:
  # Runs automatically about every 5 minutes (UTC).
  # Each run also sends short follow-up triggers so video processing
  # does not depend on the dashboard being open.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-cloudflare-worker-6
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger worker-6
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate required secret
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::Repository secret CRON_SECRET is missing or empty."
            echo "Add Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Trigger Worker and follow pending video jobs
        shell: bash
        env:
          WORKER_URL: https://6newgirl.newgirl-j.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # One GitHub run performs several short polls. The first call may
          # start the upload; later calls resume the Bluesky job by jobId.
          for attempt in $(seq 1 20); do
            http_code="$(
              curl --silent --show-error \
                --request POST \
                --connect-timeout 15 \
                --max-time 600 \
                --retry 2 \
                --retry-delay 3 \
                --retry-all-errors \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${CRON_SECRET}" \
                --header 'Accept: application/json' \
                "${WORKER_URL%/}/api/cron-trigger"
            )"

            echo "Attempt ${attempt}/20"
            echo "Worker URL: ${WORKER_URL}"
            echo "HTTP status: ${http_code}"
            echo "Worker response:"
            cat "$response_file"
            echo

            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Worker returned HTTP ${http_code}; check the Worker deployment and BSKY_DB binding."
              exit 1
            fi

            python3 - "$response_file" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error::Worker did not return valid JSON: {exc}")
              raise SystemExit(1)

          if data.get("ok") is not True:
              print("::error::Worker rejected the trigger:", data)
              raise SystemExit(1)

          if data.get("accepted") is True:
              print("Worker accepted the trigger; pending video jobs will be checked again.")
          elif data.get("skipped") is True:
              print("Worker skipped this trigger because another run is active.")
              print("reason:", data.get("reason") or "unspecified")
          else:
              print("Worker returned an unexpected success response:", data)
          PY

            if (( attempt < 20 )); then
              sleep 15
            fi
          done

          echo "GitHub follow-up polling finished. Any remaining job will be picked up by the next scheduled run."
