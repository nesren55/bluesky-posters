name: Trigger Cloudflare Workers  

'on':  
  schedule:  
    # كل 5 دقايق — آمنة بس بعد ما الـ Worker يبقى غير متزامن  
    - cron: "*/5 * * * *"  
  workflow_dispatch:  

permissions:  
  contents: read  

concurrency:  
  # منع تداخل التشغيلات لنفس الـ worker  
  group: trigger-cloudflare-workers  
  cancel-in-progress: false  

jobs:  
  ping_workers:  
    runs-on: ubuntu-latest  
    timeout-minutes: 5  

    strategy:  
      fail-fast: false  
      max-parallel: 10  

      matrix:  
        worker:  
          - name: worker-6  
            url: https://6newgirl.newgirl-j.workers.dev  
          # - name: worker-7  
          #   url: https://worker-7.workers.dev  

    steps:  
      - name: Run ${{ matrix.worker.name }}  
        env:  
          WORKER_URL: ${{ matrix.worker.url }}  
          CRON_SECRET: ${{ secrets.CRON
