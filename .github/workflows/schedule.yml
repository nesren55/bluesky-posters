name: Trigger Cloudflare Worker 6

'on':
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-6-cron
  cancel-in-progress: false

jobs:
  trigger-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Worker scheduler endpoint
        shell: bash
        env:
          WORKER_URL: https://6newgirl.newgirl-j.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::GitHub secret CRON_SECRET is missing."
            exit 1
          fi

          endpoint="${WORKER_URL%/}/api/cron-trigger"
          response_file="$(mktemp)"
          status_file="$(mktemp)"

          curl_exit=0
          curl \
            --silent \
            --show-error \
            --location \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 4 \
            --retry-delay 5 \
            --retry-max-time 75 \
            --retry-all-errors \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$endpoint" > "$status_file" || curl_exit=$?

          http_code="$(cat "$status_file" 2>/dev/null || true)"

          echo "Endpoint: ${endpoint}"
          echo "HTTP status: ${http_code:-unknown}"
          echo "Response:"
          cat "$response_file" || true
          echo

          rm -f "$response_file" "$status_file"

          if (( curl_exit != 0 )); then
            echo "::error::The Worker trigger request failed (curl exit ${curl_exit})."
            exit "$curl_exit"
          fi

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::The Worker returned a non-success HTTP status: ${http_code}"
            exit 1
          fi

          echo "Worker trigger accepted successfully."
